<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ${activeMenu}, ${breadcrumbs}, ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1 fw-semibold">대상 공지 발송</h1>
            <p class="text-muted-soft mb-0">닉네임으로 사용자를 선택해 관리자 메시지를 푸시 및 인앱 알림으로 발송합니다.</p>
        </div>
        <a th:href="@{/notices}" class="btn btn-outline-secondary d-inline-flex align-items-center gap-1">
            <i class="bi bi-megaphone"></i>
            <span>공지사항 관리</span>
        </a>
    </div>

    <div th:if="${flashMessage}" class="alert alert-elevated d-flex align-items-center"
         th:classappend="${flashStatus} == 'success' ? ' alert-success' : ' alert-danger'">
        <i class="bi"
           th:classappend="${flashStatus} == 'success' ? ' bi-check-circle-fill me-2' : ' bi-exclamation-triangle-fill me-2'"></i>
        <span th:text="${flashMessage}">처리가 완료되었습니다.</span>
    </div>

    <div th:if="${!canSend}" class="alert alert-warning border-0 rounded-4">
        <div class="fw-semibold mb-1">발송 권한이 없습니다.</div>
        <div class="small">대상 공지 발송에는 공지사항 작성 권한이 필요합니다.</div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-xl-8">
            <div class="card card-elevated">
                <div class="card-body card-body-comfy">
                    <form id="notificationSendForm" class="row g-4" method="post" th:action="@{/notifications/send}"
                          autocomplete="off" onsubmit="return confirm('입력한 대상에게 공지를 발송할까요?');">
                        <div class="col-12">
                            <label class="form-label fw-semibold" for="recipientSearch">수신자 닉네임</label>
                            <input id="notificationUserIds" name="userIds" type="hidden" th:value="${form.userIdsRaw}">
                            <div class="position-relative">
                                <input id="recipientSearch" type="search" class="form-control form-control-lg"
                                       placeholder="닉네임을 입력해 검색하세요"
                                       autocomplete="off"
                                       th:disabled="${!canSend}">
                                <div id="recipientSuggestions"
                                     class="list-group position-absolute start-0 end-0 shadow-sm d-none"
                                     style="z-index: 1050;"></div>
                            </div>
                            <div id="selectedRecipients" class="d-flex flex-wrap gap-2 mt-3"></div>
                            <div class="form-text">
                                닉네임 검색 결과에서 사용자를 선택하세요. 중복 선택은 자동으로 제외됩니다.
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold" for="notificationTitle">알림 제목</label>
                            <input id="notificationTitle" name="title" type="text" class="form-control form-control-lg"
                                   maxlength="100" placeholder="예) 안내 사항"
                                   th:disabled="${!canSend}" th:value="${form.title}">
                            <div class="form-text text-end">
                                <span id="notificationTitleCount">0</span>/100
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold" for="notificationBody">알림 본문</label>
                            <textarea id="notificationBody" name="body" class="form-control" rows="7" maxlength="500"
                                      placeholder="예) 서비스 이용에 참고해 주세요."
                                      th:disabled="${!canSend}"
                                      th:text="${form.body}"></textarea>
                            <div class="form-text text-end">
                                <span id="notificationBodyCount">0</span>/500
                            </div>
                        </div>

                        <div class="col-12 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary d-inline-flex align-items-center gap-1"
                                    th:disabled="${!canSend}">
                                <i class="bi bi-send"></i>
                                <span>대상 공지 발송</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 col-xl-4">
            <div class="card card-elevated mb-4">
                <div class="card-body card-body-comfy">
                    <h2 class="h6 fw-semibold mb-3">발송 요약</h2>
                    <dl class="row gy-3 mb-0">
                        <dt class="col-5 text-muted small">수신자</dt>
                        <dd class="col-7 mb-0 fw-semibold"><span id="recipientCount">0</span>명</dd>
                        <dt class="col-5 text-muted small">ID 목록</dt>
                        <dd class="col-7 mb-0 text-break" id="recipientPreview">-</dd>
                    </dl>
                </div>
            </div>

            <div class="card card-elevated">
                <div class="card-body card-body-comfy">
                    <h2 class="h6 fw-semibold mb-3">미리보기</h2>
                    <div class="surface-muted rounded-lg p-3">
                        <div class="fw-semibold text-break" id="messagePreviewTitle">알림 제목</div>
                        <div class="text-muted text-break mt-2" id="messagePreviewBody">알림 본문</div>
                    </div>
                    <div class="small text-muted mt-3">
                        발송 요청이 성공하면 BE에서 대상 사용자별 인앱 알림을 저장하고 푸시를 전송합니다.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            function $(id) {
                return document.getElementById(id);
            }

            var userIdsEl = $('notificationUserIds');
            var searchEl = $('recipientSearch');
            var suggestionsEl = $('recipientSuggestions');
            var selectedRecipientsEl = $('selectedRecipients');
            var titleEl = $('notificationTitle');
            var bodyEl = $('notificationBody');
            var recipientCountEl = $('recipientCount');
            var recipientPreviewEl = $('recipientPreview');
            var previewTitleEl = $('messagePreviewTitle');
            var previewBodyEl = $('messagePreviewBody');
            var titleCountEl = $('notificationTitleCount');
            var bodyCountEl = $('notificationBodyCount');
            var selectedUsers = parseInitialUsers(userIdsEl ? userIdsEl.value : '');
            var searchTimer = null;
            var latestSearchSeq = 0;

            function uniqueIds(raw) {
                if (!raw || !raw.trim()) {
                    return [];
                }
                var seen = {};
                return raw.trim().split(/[,\s]+/).filter(function (value) {
                    if (!value || seen[value]) {
                        return false;
                    }
                    seen[value] = true;
                    return true;
                });
            }

            function parseInitialUsers(raw) {
                return uniqueIds(raw).map(function (id) {
                    return {
                        id: id,
                        nickname: '#' + id
                    };
                });
            }

            function labelFor(user) {
                if (!user) {
                    return '';
                }
                if (user.nickname && user.nickname.charAt(0) === '#') {
                    return user.nickname;
                }
                return user.nickname + ' (#' + user.id + ')';
            }

            function syncSelectedRecipients() {
                if (userIdsEl) {
                    userIdsEl.value = selectedUsers.map(function (user) {
                        return user.id;
                    }).join(',');
                }
                if (!selectedRecipientsEl) {
                    return;
                }
                selectedRecipientsEl.innerHTML = '';
                if (selectedUsers.length === 0) {
                    var empty = document.createElement('span');
                    empty.className = 'text-muted small';
                    empty.textContent = '선택된 수신자가 없습니다.';
                    selectedRecipientsEl.appendChild(empty);
                    return;
                }
                selectedUsers.forEach(function (user) {
                    var chip = document.createElement('span');
                    chip.className = 'badge rounded-pill text-bg-primary d-inline-flex align-items-center gap-1 px-3 py-2';
                    chip.textContent = labelFor(user);

                    var removeButton = document.createElement('button');
                    removeButton.type = 'button';
                    removeButton.className = 'btn-close btn-close-white ms-1';
                    removeButton.setAttribute('aria-label', labelFor(user) + ' 제거');
                    removeButton.addEventListener('click', function () {
                        selectedUsers = selectedUsers.filter(function (selected) {
                            return selected.id !== user.id;
                        });
                        syncSelectedRecipients();
                        syncPreview();
                    });
                    chip.appendChild(removeButton);
                    selectedRecipientsEl.appendChild(chip);
                });
            }

            function hideSuggestions() {
                if (!suggestionsEl) {
                    return;
                }
                suggestionsEl.classList.add('d-none');
                suggestionsEl.innerHTML = '';
            }

            function showSuggestionMessage(message) {
                if (!suggestionsEl) {
                    return;
                }
                suggestionsEl.innerHTML = '';
                var item = document.createElement('div');
                item.className = 'list-group-item text-muted small';
                item.textContent = message;
                suggestionsEl.appendChild(item);
                suggestionsEl.classList.remove('d-none');
            }

            function addRecipient(user) {
                var id = String(user.id);
                var exists = selectedUsers.some(function (selected) {
                    return selected.id === id;
                });
                if (!exists) {
                    selectedUsers.push({
                        id: id,
                        nickname: user.nickname
                    });
                }
                if (searchEl) {
                    searchEl.value = '';
                    searchEl.focus();
                }
                hideSuggestions();
                syncSelectedRecipients();
                syncPreview();
            }

            function renderSuggestions(users) {
                if (!suggestionsEl) {
                    return;
                }
                suggestionsEl.innerHTML = '';
                var candidates = users.filter(function (user) {
                    return !selectedUsers.some(function (selected) {
                        return selected.id === String(user.id);
                    });
                });
                if (candidates.length === 0) {
                    showSuggestionMessage('검색 결과가 없습니다.');
                    return;
                }
                candidates.forEach(function (user) {
                    var button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                    button.innerHTML = '<span></span><span class="text-muted small"></span>';
                    button.querySelector('span:first-child').textContent = user.nickname;
                    button.querySelector('span:last-child').textContent = '#' + user.id;
                    button.addEventListener('click', function () {
                        addRecipient(user);
                    });
                    suggestionsEl.appendChild(button);
                });
                suggestionsEl.classList.remove('d-none');
            }

            function searchRecipients(query) {
                var trimmed = query ? query.trim() : '';
                if (!trimmed) {
                    hideSuggestions();
                    return;
                }
                var searchSeq = ++latestSearchSeq;
                fetch('/notifications/users/search?q=' + encodeURIComponent(trimmed), {
                    headers: {
                        'Accept': 'application/json'
                    },
                    credentials: 'same-origin'
                })
                        .then(function (response) {
                            if (!response.ok) {
                                throw new Error('Search failed');
                            }
                            return response.json();
                        })
                        .then(function (data) {
                            if (searchSeq !== latestSearchSeq) {
                                return;
                            }
                            renderSuggestions(data && data.users ? data.users : []);
                        })
                        .catch(function () {
                            if (searchSeq === latestSearchSeq) {
                                showSuggestionMessage('사용자 검색에 실패했습니다.');
                            }
                        });
            }

            function syncPreview() {
                var recipients = selectedUsers.map(labelFor);
                var title = titleEl && titleEl.value.trim() ? titleEl.value.trim() : '알림 제목';
                var body = bodyEl && bodyEl.value.trim() ? bodyEl.value.trim() : '알림 본문';

                if (recipientCountEl) {
                    recipientCountEl.textContent = selectedUsers.length;
                }
                if (recipientPreviewEl) {
                    recipientPreviewEl.textContent = recipients.length > 0 ? recipients.join(', ') : '-';
                }
                if (previewTitleEl) {
                    previewTitleEl.textContent = title;
                }
                if (previewBodyEl) {
                    previewBodyEl.textContent = body;
                }
                if (titleCountEl) {
                    titleCountEl.textContent = titleEl && titleEl.value ? titleEl.value.length : 0;
                }
                if (bodyCountEl) {
                    bodyCountEl.textContent = bodyEl && bodyEl.value ? bodyEl.value.length : 0;
                }
            }

            [userIdsEl, titleEl, bodyEl].forEach(function (element) {
                if (element) {
                    element.addEventListener('input', syncPreview);
                }
            });

            if (searchEl) {
                searchEl.addEventListener('input', function () {
                    window.clearTimeout(searchTimer);
                    searchTimer = window.setTimeout(function () {
                        searchRecipients(searchEl.value);
                    }, 250);
                });
                searchEl.addEventListener('keydown', function (event) {
                    if (event.key === 'Escape') {
                        hideSuggestions();
                    }
                });
            }

            document.addEventListener('click', function (event) {
                if (!suggestionsEl || !searchEl) {
                    return;
                }
                if (event.target === searchEl || suggestionsEl.contains(event.target)) {
                    return;
                }
                hideSuggestions();
            });

            syncSelectedRecipients();
            syncPreview();
        })();
    </script>
</th:block>
</html>
