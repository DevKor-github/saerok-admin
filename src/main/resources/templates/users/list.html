<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ${activeMenu}, ${breadcrumbs}, ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1 fw-semibold">사용자 목록</h1>
            <p class="text-muted-soft mb-0">대상 공지 발송에 사용할 사용자 ID와 닉네임을 조회합니다.</p>
        </div>
    </div>

    <div th:if="${loadError}" class="alert alert-warning border-0 rounded-4">
        <div class="fw-semibold mb-1">목록을 불러올 수 없습니다.</div>
        <div class="small" th:text="${loadError}">사용자 목록을 불러오지 못했습니다.</div>
    </div>

    <div class="card card-elevated mb-4">
        <div class="card-body card-body-comfy">
            <form class="row g-3 align-items-end" method="get">
                <div class="col-md-5">
                    <label class="form-label small text-uppercase text-muted" for="userQuery">닉네임 검색</label>
                    <input type="search" class="form-control" id="userQuery" name="q"
                           placeholder="닉네임 일부를 입력하세요" th:value="${query}"
                           th:disabled="${!canViewUsers}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-uppercase text-muted" for="userSize">페이지 크기</label>
                    <select class="form-select" id="userSize" name="size" th:disabled="${!canViewUsers}">
                        <option value="20" th:selected="${size == 20}">20</option>
                        <option value="50" th:selected="${size == 50}">50</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1" th:disabled="${!canViewUsers}">검색</button>
                    <a th:href="@{/users}" class="btn btn-outline-secondary">초기화</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card card-elevated">
        <div class="table-responsive table-shell">
            <table class="table table-modern align-middle table-hover">
                <thead>
                <tr>
                    <th style="width: 180px;">ID</th>
                    <th>닉네임</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="2" class="text-center text-muted py-5">조회된 사용자가 없습니다.</td>
                </tr>
                <tr th:each="user : ${users}">
                    <td class="fw-semibold" th:text="${'#' + user.id()}">#501</td>
                    <td th:text="${user.nickname()}">솔바람</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white border-0 py-3">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <span class="text-muted small">
                    총 <strong th:text="${totalElements}">0</strong>명
                    <span th:if="${totalPages > 0}">
                        · <strong th:text="${page}">1</strong>/<span th:text="${totalPages}">1</span> 페이지
                    </span>
                </span>
                <ul class="pagination pagination-sm mb-0" th:if="${totalPages > 0}">
                    <li class="page-item" th:classappend="${page == 1} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/users(page=${page - 1 < 1 ? 1 : page - 1}, size=${size}, q=${query})}">이전</a>
                    </li>
                    <li class="page-item" th:each="pageNum : ${pageNumbers}"
                        th:classappend="${pageNum == page} ? ' active'">
                        <a class="page-link" th:text="${pageNum}"
                           th:href="@{/users(page=${pageNum}, size=${size}, q=${query})}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${page == totalPages} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/users(page=${page + 1 > totalPages ? totalPages : page + 1}, size=${size}, q=${query})}">다음</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</th:block>
</html>
