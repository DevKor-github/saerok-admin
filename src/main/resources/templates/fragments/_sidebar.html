<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar(activeMenu)" class="app-sidebar-slot">
    <div id="appSidebarDesktop" class="app-sidebar d-none d-lg-flex flex-column position-fixed">
        <div class="app-sidebar__brand">
            <img th:src="@{/images/saerok-admin-icon.png}" src="/images/saerok-admin-icon.png" alt="새록 어드민 로고" width="48" height="48" class="me-2">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="app-sidebar__title mb-0">새록 어드민</span>
                <span class="environment-badge"
                      th:if="${environmentProfileBadge != null}"
                      th:classappend="${environmentProfileBadge.cssClass}"
                      th:text="${environmentProfileBadge.label}">운영</span>
            </div>
        </div>
        <nav class="app-sidebar__nav">
            <a th:href="@{/}" class="app-sidebar__link" th:classappend="${activeMenu}=='dashboard' ? ' is-active'">
                <i class="bi bi-speedometer2"></i>
                <span>대시보드</span>
            </a>
            <div class="app-sidebar__group"
                 th:classappend="${activeMenu == 'serviceInsightTimeSeries' or activeMenu == 'serviceInsightSubscriberStatus'} ? ' is-active'">
                <div class="app-sidebar__group-label">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>서비스 인사이트</span>
                </div>
                <div class="app-sidebar__subnav">
                    <a th:href="@{/service-insight/time-series}" class="app-sidebar__sublink"
                       th:classappend="${activeMenu} == 'serviceInsightTimeSeries' ? ' is-active'">
                        <span>시계열</span>
                    </a>
                    <a th:href="@{/service-insight/subscriber-status}" class="app-sidebar__sublink"
                       th:classappend="${activeMenu} == 'serviceInsightSubscriberStatus' ? ' is-active'">
                        <span>가입자 현황</span>
                    </a>
                </div>
            </div>
            <a th:href="@{/users}" class="app-sidebar__link" th:classappend="${activeMenu}=='users' ? ' is-active'">
                <i class="bi bi-people"></i>
                <span>사용자 목록</span>
            </a>
            <a th:href="@{/dex}" class="app-sidebar__link" th:classappend="${activeMenu}=='dex' ? ' is-active'">
                <i class="bi bi-journal-richtext"></i>
                <span>도감 관리</span>
            </a>
            <a th:href="@{/reports}" class="app-sidebar__link" th:classappend="${activeMenu}=='reports' ? ' is-active'">
                <i class="bi bi-flag"></i>
                <span>신고 관리</span>
            </a>
            <a th:href="@{/ads}" class="app-sidebar__link" th:classappend="${activeMenu}=='ads' ? ' is-active'">
                <i class="bi bi-badge-ad"></i>
                <span>광고 관리</span>
            </a>
            <a th:href="@{/notices}" class="app-sidebar__link"
               th:classappend="${activeMenu}=='notices' ? ' is-active fw-semibold'">
                <i class="bi bi-megaphone"></i>
                <span>공지사항 관리</span>
            </a>
            <a th:href="@{/notifications/compose}" class="app-sidebar__link"
               th:classappend="${activeMenu}=='notifications' ? ' is-active fw-semibold'">
                <i class="bi bi-send"></i>
                <span>대상 공지 발송</span>
            </a>
            <a th:href="@{/admin/audit-logs}" class="app-sidebar__link"
               th:classappend="${activeMenu}=='adminAuditLogs' ? ' is-active'">
                <i class="bi bi-clipboard-check"></i>
                <span>관리자 활동 로그</span>
            </a>
            <a th:href="@{/admin/roles}" class="app-sidebar__link"
               th:classappend="${activeMenu}=='adminRoles' ? ' is-active'">
                <i class="bi bi-shield-lock"></i>
                <span>운영 권한</span>
            </a>
        </nav>
        <div class="app-sidebar__footer">
            <div>버전 0.1.0</div>
            <div>© 2025 Saerok</div>
        </div>
    </div>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas">
        <div class="offcanvas-header">
            <div class="d-flex align-items-center gap-2">
                <img th:src="@{/images/saerok-admin-icon.png}" src="/images/saerok-admin-icon.png"
                     alt="새록 어드민 로고" width="32" height="32" class="flex-shrink-0">
                <h5 class="offcanvas-title mb-0">새록 어드민</h5>
                <span class="environment-badge"
                      th:if="${environmentProfileBadge != null}"
                      th:classappend="${environmentProfileBadge.cssClass}"
                      th:text="${environmentProfileBadge.label}">운영</span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <nav class="app-sidebar__nav">
                <a th:href="@{/}" class="app-sidebar__link" th:classappend="${activeMenu}=='dashboard' ? ' is-active fw-semibold'">
                    <i class="bi bi-speedometer2"></i>
                    <span>대시보드</span>
                </a>
                <div class="app-sidebar__group"
                     th:classappend="${activeMenu == 'serviceInsightTimeSeries' or activeMenu == 'serviceInsightSubscriberStatus'} ? ' is-active'">
                    <div class="app-sidebar__group-label">
                        <i class="bi bi-graph-up-arrow"></i>
                        <span>서비스 인사이트</span>
                    </div>
                    <div class="app-sidebar__subnav">
                        <a th:href="@{/service-insight/time-series}" class="app-sidebar__sublink"
                           th:classappend="${activeMenu} == 'serviceInsightTimeSeries' ? ' is-active fw-semibold'">
                            <span>시계열</span>
                        </a>
                        <a th:href="@{/service-insight/subscriber-status}" class="app-sidebar__sublink"
                           th:classappend="${activeMenu} == 'serviceInsightSubscriberStatus' ? ' is-active fw-semibold'">
                            <span>가입자 현황</span>
                        </a>
                    </div>
                </div>
                <a th:href="@{/users}" class="app-sidebar__link"
                   th:classappend="${activeMenu}=='users' ? ' is-active fw-semibold'">
                    <i class="bi bi-people"></i>
                    <span>사용자 목록</span>
                </a>
                <a th:href="@{/dex}" class="app-sidebar__link"
                   th:classappend="${activeMenu}=='dex' ? ' is-active fw-semibold'">
                    <i class="bi bi-journal-richtext"></i>
                    <span>도감 관리</span>
                </a>
                <a th:href="@{/reports}" class="app-sidebar__link" th:classappend="${activeMenu}=='reports' ? ' is-active fw-semibold'">
                    <i class="bi bi-flag"></i>
                    <span>신고 관리</span>
                </a>
                <a th:href="@{/ads}" class="app-sidebar__link" th:classappend="${activeMenu}=='ads' ? ' is-active fw-semibold'">
                    <i class="bi bi-badge-ad"></i>
                    <span>광고 관리</span>
                </a>
                <a th:href="@{/notices}" class="app-sidebar__link"
                   th:classappend="${activeMenu}=='notices' ? ' is-active fw-semibold'">
                    <i class="bi bi-megaphone"></i>
                    <span>공지사항 관리</span>
                </a>
                <a th:href="@{/notifications/compose}" class="app-sidebar__link"
                   th:classappend="${activeMenu}=='notifications' ? ' is-active fw-semibold'">
                    <i class="bi bi-send"></i>
                    <span>대상 공지 발송</span>
                </a>
                <a th:href="@{/admin/audit-logs}" class="app-sidebar__link"
                   th:classappend="${activeMenu}=='adminAuditLogs' ? ' is-active fw-semibold'">
                    <i class="bi bi-clipboard-check"></i>
                    <span>관리자 활동 로그</span>
                </a>
                <a th:href="@{/admin/roles}" class="app-sidebar__link"
                   th:classappend="${activeMenu}=='adminRoles' ? ' is-active fw-semibold'">
                    <i class="bi bi-shield-lock"></i>
                    <span>운영 권한</span>
                </a>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
