<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ${activeMenu}, ${breadcrumbs}, ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1 fw-semibold">공지사항 관리</h1>
            <p class="text-muted-soft mb-0">앱 공지사항을 작성하고(추후) 게시/예약 게시를 관리합니다.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/notices/new}" class="btn btn-primary">
                <i class="bi bi-pencil-square me-1"></i>
                공지사항 작성
            </a>
        </div>
    </div>

    <div class="card card-elevated">
        <div class="card-body">
            <div class="text-muted">
                현재는 <strong>공지사항 작성</strong> 기능만 제공됩니다.
                <div class="mt-2 small">
                    게시/예약/목록/수정/삭제 기능은 백엔드 연동이 완료되면 추가될 예정입니다.
                </div>
            </div>
        </div>
    </div>
</th:block>
</html>
