<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ${activeMenu}, ${breadcrumbs}, ~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1 fw-semibold">공지사항 관리</h1>
            <p class="text-muted-soft mb-0">앱 공지사항을 작성하고 게시/예약 게시를 관리합니다.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <a th:if="${canWrite}" th:href="@{/notices/new}" class="btn btn-primary">
                <i class="bi bi-pencil-square me-1"></i>
                공지사항 작성
            </a>
        </div>
    </div>

    <div th:if="${flashMessage}" class="alert alert-elevated d-flex align-items-center"
         th:classappend="${flashStatus} == 'success' ? ' alert-success' : ' alert-danger'">
        <i class="bi"
           th:classappend="${flashStatus} == 'success' ? ' bi-check-circle-fill' : ' bi-exclamation-triangle-fill'"></i>
        <div class="ms-2" th:text="${flashMessage}">작업이 완료되었습니다.</div>
    </div>

    <div th:if="${loadError}" class="alert alert-warning border-0 rounded-4">
        <div class="fw-semibold mb-1">공지사항을 불러올 수 없습니다.</div>
        <div class="small" th:text="${loadError}">잠시 후 다시 시도해주세요.</div>
    </div>

    <div class="card card-elevated">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(announcements)}" class="text-muted small">
                등록된 공지사항이 없습니다.
            </div>

            <div th:unless="${#lists.isEmpty(announcements)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col" style="width: 80px;">ID</th>
                        <th scope="col">제목</th>
                        <th scope="col" style="width: 140px;">상태</th>
                        <th scope="col" style="width: 180px;">예약 시각</th>
                        <th scope="col" style="width: 180px;">게시 시각</th>
                        <th scope="col" style="width: 160px;">작성자</th>
                        <th scope="col" style="width: 180px;">작업</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${announcements}">
                        <td th:text="${item.id()}">1</td>
                        <td>
                            <div class="fw-semibold" th:text="${item.title()}">공지사항 제목</div>
                            <div class="small text-muted">
                                <span th:text="${item.status()}">SCHEDULED</span>
                            </div>
                        </td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:text="${item.status()}"
                                  th:classappend="${item.status()} == 'PUBLISHED' ? ' text-bg-success' : ' text-bg-primary'">SCHEDULED</span>
                        </td>
                        <td class="small text-muted"
                            th:text="${item.scheduledAt() != null ? #temporals.format(item.scheduledAt(), 'yyyy-MM-dd HH:mm') : '-'}">
                            -
                        </td>
                        <td class="small text-muted"
                            th:text="${item.publishedAt() != null ? #temporals.format(item.publishedAt(), 'yyyy-MM-dd HH:mm') : '-'}">
                            -
                        </td>
                        <td class="small text-muted" th:text="${item.adminName()}">운영자</td>
                        <td>
                            <div class="d-flex flex-wrap gap-2">
                                <a th:if="${canWrite and item.status() == 'SCHEDULED'}"
                                   th:href="@{/notices/edit(id=${item.id()})}"
                                   class="btn btn-sm btn-outline-primary">
                                    수정
                                </a>

                                <form th:if="${canWrite}" th:action="@{/notices/delete}" method="post"
                                      onsubmit="return confirm('공지사항을 삭제하시겠습니까?');">
                                    <input type="hidden" name="id" th:value="${item.id()}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        삭제
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${!canWrite}" class="small text-muted mt-3">
                ※ 공지사항 작성/수정/삭제 권한이 없습니다.
            </div>
        </div>
    </div>
</th:block>
</html>
