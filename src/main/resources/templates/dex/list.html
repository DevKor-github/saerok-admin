<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${pageTitle}, ${activeMenu}, ${breadcrumbs}, ~{::content})}">
<th:block th:fragment="content">
    <div th:if="${flashMessage}" class="alert alert-elevated d-flex align-items-center"
         th:classappend="${flashStatus} == 'success' ? ' alert-success' : ' alert-danger'">
        <i class="bi"
           th:classappend="${flashStatus} == 'success' ? ' bi-check-circle-fill me-2' : ' bi-exclamation-triangle-fill me-2'"></i>
        <span th:text="${flashMessage}">처리가 완료되었습니다.</span>
    </div>

    <div th:if="${loadError}" class="alert alert-danger alert-elevated d-flex align-items-center">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${loadError}">도감 목록을 불러오지 못했습니다.</span>
    </div>

    <div class="card card-elevated mb-4">
        <div class="card-body card-body-comfy">
            <form class="row g-3 align-items-end" method="get" th:action="@{/dex}">
                <div class="col-12 col-md-6 col-lg-5">
                    <label for="query" class="form-label small text-uppercase text-muted">검색어</label>
                    <input type="search" id="query" name="q" class="form-control" placeholder="국문명 또는 학명"
                           th:value="${query}">
                </div>
                <div class="col-6 col-md-3 col-lg-2">
                    <label for="size" class="form-label small text-uppercase text-muted">표시 수</label>
                    <select id="size" name="size" class="form-select">
                        <option value="10" th:selected="${size == 10}">10개</option>
                        <option value="20" th:selected="${size == 20}">20개</option>
                        <option value="50" th:selected="${size == 50}">50개</option>
                    </select>
                </div>
                <div class="col-6 col-md-3 col-lg-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-search me-1"></i>검색
                    </button>
                    <a th:href="@{/dex}" class="btn btn-outline-secondary">초기화</a>
                </div>
            </form>
        </div>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <p class="mb-0 text-muted">
            총 <strong th:text="${totalElements}">0</strong>건
            <span th:if="${totalPages > 0}">
                · <strong th:text="${page}">1</strong>/<span th:text="${totalPages}">1</span> 페이지
            </span>
        </p>
        <a th:href="@{/dex/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-2"></i>도감 등록
        </a>
    </div>

    <div class="card card-elevated">
        <div class="table-responsive table-shell">
            <table class="table table-modern table-hover align-middle">
                <thead>
                <tr>
                    <th scope="col">도감</th>
                    <th scope="col">학명</th>
                    <th scope="col">서식지</th>
                    <th scope="col">보호등급</th>
                    <th scope="col">체장</th>
                    <th scope="col" class="text-end">수정일</th>
                    <th scope="col" class="text-end">액션</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(entries)}">
                    <td colspan="7" class="text-center text-muted py-5">등록된 도감이 없습니다.</td>
                </tr>
                <tr th:each="entry : ${entries}">
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <img th:if="${!#strings.isEmpty(entry.thumbImageUrl())}" th:src="${entry.thumbImageUrl()}"
                                 alt="대표 이미지" class="media-thumb media-thumb--square-lg flex-shrink-0">
                            <div th:if="${#strings.isEmpty(entry.thumbImageUrl())}"
                                 class="media-thumb media-thumb--square-lg bg-light d-flex align-items-center justify-content-center text-muted flex-shrink-0">
                                <i class="bi bi-image"></i>
                            </div>
                            <div>
                                <div class="fw-semibold" th:text="${entry.koreanName()}">해오라기</div>
                                <div class="text-muted small" th:text="${'#' + entry.id()}">#401</div>
                            </div>
                        </div>
                    </td>
                    <td class="fst-italic" th:text="${entry.scientificName()}">Butorides striata</td>
                    <td>
                        <span class="badge text-bg-light me-1" th:each="habitat : ${entry.habitats()}"
                              th:text="${habitat}">하천/호수</span>
                        <span th:if="${#lists.isEmpty(entry.habitats())}" class="text-muted">-</span>
                    </td>
                    <td>
                        <span class="badge text-bg-secondary" th:text="${entry.conservationGrade()}">해당 없음</span>
                    </td>
                    <td>
                        <span th:if="${entry.bodyLengthCm() != null}" th:text="${entry.bodyLengthCm() + ' cm'}">45 cm</span>
                        <span th:if="${entry.bodyLengthCm() == null}" class="text-muted">-</span>
                    </td>
                    <td class="text-end">
                        <span th:if="${entry.updatedAt() != null}"
                              th:text="${#temporals.format(entry.updatedAt(), 'yyyy.MM.dd HH:mm')}">2024.06.01 14:20</span>
                        <span th:if="${entry.updatedAt() == null}" class="text-muted">-</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/dex/' + ${entry.id()}}" class="btn btn-sm btn-outline-secondary">상세</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white border-0 py-3" th:if="${totalPages > 1}">
            <nav aria-label="도감 목록 페이지">
                <ul class="pagination justify-content-end mb-0">
                    <li class="page-item" th:classappend="${page <= 1} ? ' disabled'">
                        <a class="page-link" th:href="@{/dex(page=${page - 1 < 1 ? 1 : page - 1}, size=${size}, q=${query})}">이전</a>
                    </li>
                    <li class="page-item" th:each="pageNum : ${pageNumbers}" th:classappend="${pageNum == page} ? ' active'">
                        <a class="page-link" th:text="${pageNum}" th:href="@{/dex(page=${pageNum}, size=${size}, q=${query})}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${page >= totalPages} ? ' disabled'">
                        <a class="page-link" th:href="@{/dex(page=${page + 1 > totalPages ? totalPages : page + 1}, size=${size}, q=${query})}">다음</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</th:block>
</html>
