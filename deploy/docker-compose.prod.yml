services:
  app:
    image: ghcr.io/devkor-github/saerok-admin:prod-latest
    container_name: saerok-admin-prod
    restart: unless-stopped
    stop_grace_period: 15s
    ports: ["8081:8081"]

    # t3.micro + low-traffic admin 기준
    cpus: "0.30"
    cpu_shares: 256

    # 기존: mem_limit 320m / reservation 220m
    # → 너무 넉넉해서 호스트 메모리를 압박하는 상황
    mem_limit: "220m"
    mem_reservation: "160m"

    env_file:
      - /run/saerok-admin/env.prod

    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_FORWARD_HEADERS_STRATEGY: "native"
      # 자바 메모리/타임존 튜닝
      JAVA_OPTS: >-
        -Duser.timezone=Asia/Seoul
        -Xms96m -Xmx128m
        -XX:MaxMetaspaceSize=64m
        -XX:MaxDirectMemorySize=16m
        -XX:ReservedCodeCacheSize=32m
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
